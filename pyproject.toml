[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigi-vision"
version = "0.1.0"
description = "AI-assisted investigation workflows for TP-Link VIGI camera data."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.140.11",
    "openai>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tp-link-vigi-sdk==0.3.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
vigi-vision = "vigi_vision.cli:app"

[dependency-groups]
assisted-roi-build = [
    "setuptools==70.2.0",
    "wheel==0.48.0",
]
assisted-roi = [
    "efficient-sam @ git+https://github.com/yformer/EfficientSAM.git@d525f622e6f640acf5a0fc37c7ca1f243da5bde0",
    "torch==2.10.0+cpu",
    "torchvision==0.25.0+cpu",
]
dev = [
    "basedpyright>=1.21",
    "httpx2[brotli,http2,zstd]>=2.9.1",
    "pytest>=8",
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
no-build-isolation-package = ["efficient-sam"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vigi_vision = ["reference_frame_web/*.css", "reference_frame_web/*.html", "reference_frame_web/*.js"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.10"
pythonPlatform = "All"
include = ["src", "tests"]
stubPath = "typings"
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001", "TC001", "TC003"]
"src/vigi_vision/assisted_roi_*.py" = ["D"]
"src/vigi_vision/assisted_roi_predictor.py" = ["D", "TC003"]
"src/vigi_vision/assisted_roi_service.py" = ["D", "PLC0415", "TC003"]
"src/vigi_vision/config.py" = ["D101", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
